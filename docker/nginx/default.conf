server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    # Same as post_max_size in docker/php/php.ini. Only the routes that take
    # several images get more (see the /garage/tools location below).
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Creation (POST /garage/tools) and edition (POST /garage/tools/{id} with
    # _method=patch) of a tool: up to 8 photos of 10 MB (ToolRequest). Handled
    # here, not through try_files: nginx checks the body size in the location
    # that reads it, so an internal redirect to index.php would apply 25M.
    location ~ ^/garage/tools(/\d+)?$ {
        client_max_body_size 90M;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param PHP_VALUE "post_max_size=90M\nupload_max_filesize=20M";
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
