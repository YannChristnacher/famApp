services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:22-bookworm-slim
    working_dir: /app
    # node_modules lives in a container-only volume: host-installed native binaries
    # (esbuild, rollup, tailwind oxide) do not run in this Linux container.
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_HMR_CLIENT_PORT: ${VITE_PORT:-5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - vite-node-modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-famapp}
      MYSQL_USER: ${DB_USERNAME:-famapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
  vite-node-modules:
